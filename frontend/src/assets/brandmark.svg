<!-- Marca de Turtle Trips: tinta = currentColor (se adapta al tema), placa central verde -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-180 -200 360 360" aria-hidden="true">
  <defs>
    <mask id="tt-mark-scutes">
      <rect x="-180" y="-200" width="360" height="360" fill="white" />
      <!-- anillo que separa caparazón de cabeza/aletas/cola -->
      <ellipse cx="0" cy="18" rx="94" ry="106" fill="none" stroke="black" stroke-width="10" />
      <!-- hueco hexagonal centrado en el centro del caparazón (0,18), R=50 -->
      <polygon points="0,-32 43.3,-7 43.3,43 0,68 -43.3,43 -43.3,-7" fill="black" />
      <!-- surcos radiales desde cada vértice hasta el anillo (rayos desde el centro) -->
      <g stroke="black" stroke-width="10" stroke-linecap="round">
        <line x1="0" y1="-32" x2="0" y2="-88" />
        <line x1="43.3" y1="-7" x2="83.7" y2="-30.3" />
        <line x1="-43.3" y1="-7" x2="-83.7" y2="-30.3" />
        <line x1="43.3" y1="43" x2="83.7" y2="66.3" />
        <line x1="-43.3" y1="43" x2="-83.7" y2="66.3" />
        <line x1="0" y1="68" x2="0" y2="124" />
      </g>
    </mask>
  </defs>
  <g mask="url(#tt-mark-scutes)">
    <!-- partes con clase para la animación de nado (tt-swim en style.css):
         los <g> no llevan transform propio, así el CSS puede rotarlos sin
         pisar el transform de posición de cada ellipse -->
    <g fill="currentColor">
      <g class="tt-turtle-flipper tt-turtle-ffl">
        <ellipse cx="0" cy="0" rx="62" ry="23" transform="translate(-94,-62) rotate(40)" />
      </g>
      <g class="tt-turtle-flipper tt-turtle-ffr">
        <ellipse cx="0" cy="0" rx="62" ry="23" transform="translate(94,-62) rotate(-40)" />
      </g>
      <g class="tt-turtle-flipper tt-turtle-bfl">
        <ellipse cx="0" cy="0" rx="44" ry="18" transform="translate(-72,102) rotate(-45)" />
      </g>
      <g class="tt-turtle-flipper tt-turtle-bfr">
        <ellipse cx="0" cy="0" rx="44" ry="18" transform="translate(72,102) rotate(45)" />
      </g>
      <g class="tt-turtle-tail">
        <path d="M -14 110 Q 0 172 14 110 Z" />
      </g>
      <g class="tt-turtle-head">
        <circle cx="0" cy="-140" r="34" />
        <rect x="-19" y="-140" width="38" height="70" />
      </g>
      <ellipse cx="0" cy="18" rx="94" ry="106" />
    </g>
  </g>
  <!-- placa verde: mismo hexágono a R=41, también centrado en (0,18) -->
  <polygon points="0,-23 35.5,-2.5 35.5,38.5 0,59 -35.5,38.5 -35.5,-2.5" fill="#10B981" />
</svg>
