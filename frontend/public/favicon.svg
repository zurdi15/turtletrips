<svg xmlns="http://www.w3.org/2000/svg" viewBox="-183 -190 366 366" aria-label="Turtle Trips">
  <!-- Favicon = la tortuga del README (docs/assets/logo.svg). La tinta del cuerpo
       sigue el esquema de color del sistema, como el <picture> del README; la
       placa verde es fija. Los PNG del manifest (pwa/apple/maskable) son la
       baldosa verde con la tortuga blanca: la pantalla de inicio necesita fondo. -->
  <style>
    .tt-body { fill: #0F172A; }
    @media (prefers-color-scheme: dark) { .tt-body { fill: #E2E8F0; } }
  </style>
  <defs>
    <mask id="tt-fav-scutes">
      <rect x="-183" y="-190" width="366" height="366" fill="white" />
      <ellipse cx="0" cy="18" rx="94" ry="106" fill="none" stroke="black" stroke-width="10" />
      <polygon points="0,-32 43.3,-7 43.3,43 0,68 -43.3,43 -43.3,-7" fill="black" />
      <g stroke="black" stroke-width="10" stroke-linecap="round">
        <line x1="0" y1="-32" x2="0" y2="-88" />
        <line x1="43.3" y1="-7" x2="83.7" y2="-30.3" />
        <line x1="-43.3" y1="-7" x2="-83.7" y2="-30.3" />
        <line x1="43.3" y1="43" x2="83.7" y2="66.3" />
        <line x1="-43.3" y1="43" x2="-83.7" y2="66.3" />
        <line x1="0" y1="68" x2="0" y2="124" />
      </g>
    </mask>
  </defs>
  <g mask="url(#tt-fav-scutes)">
    <g class="tt-body">
      <ellipse cx="0" cy="0" rx="62" ry="23" transform="translate(-94,-62) rotate(40)" />
      <ellipse cx="0" cy="0" rx="62" ry="23" transform="translate(94,-62) rotate(-40)" />
      <ellipse cx="0" cy="0" rx="44" ry="18" transform="translate(-72,102) rotate(-45)" />
      <ellipse cx="0" cy="0" rx="44" ry="18" transform="translate(72,102) rotate(45)" />
      <path d="M -14 110 Q 0 172 14 110 Z" />
      <circle cx="0" cy="-140" r="34" />
      <rect x="-19" y="-140" width="38" height="70" />
      <ellipse cx="0" cy="18" rx="94" ry="106" />
    </g>
  </g>
  <polygon points="0,-23 35.5,-2.5 35.5,38.5 0,59 -35.5,38.5 -35.5,-2.5" fill="#10B981" />
</svg>
