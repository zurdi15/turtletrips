name: Release

# Publica la imagen multi-arch en GHCR. Dos vías:
#  · manual: Actions → Release → "Run workflow" (elige versión y plataformas)
#  · automática: al empujar una tag vX.Y.Z
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versión de la imagen (ej. 1.6.0). Vacío = tag actual sin la v"
        required: false
        type: string
      latest:
        description: "Mover también el tag :latest"
        type: boolean
        default: true
      platforms:
        description: "Plataformas del build"
        required: false
        default: linux/amd64,linux/arm64
        type: string
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

# dos releases de la misma ref a la vez se pisarían los tags
concurrency:
  group: release-${{ github.ref }}

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  checks:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: pytest
        working-directory: backend
        run: uv run pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      # guard-tokens.sh necesita ripgrep; sin él los checks pasarían en falso
      - name: ripgrep
        run: sudo apt-get install -y --no-install-recommends ripgrep
      - name: typecheck + vitest + guard de tokens
        working-directory: frontend
        run: |
          npm run typecheck
          npm test
          npm run guard:tokens

  publish:
    name: Imagen multi-arch → GHCR
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolver versión y tags
        id: meta
        run: |
          set -euo pipefail
          version="${{ inputs.version }}"
          if [ -z "$version" ]; then
            if [ "$GITHUB_REF_TYPE" != "tag" ]; then
              echo "::error::Sin 'version' de entrada solo se puede lanzar desde una tag (ref actual: $GITHUB_REF_NAME)"
              exit 1
            fi
            version="${GITHUB_REF_NAME#v}"
          fi
          tags="$IMAGE:$version"
          # en un push de tag inputs.latest viene vacío: latest se mueve igual
          if [ "${{ inputs.latest }}" != "false" ]; then
            tags="$tags,$IMAGE:latest"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ inputs.platforms || 'linux/amd64,linux/arm64' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resumen
        run: |
          {
            echo "### Publicado"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}" | tr ',' '\n'
            echo '```'
            echo "Plataformas: \`${{ inputs.platforms || 'linux/amd64,linux/arm64' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
